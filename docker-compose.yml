services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: takeo_gemstones
      POSTGRES_USER: takeo
      POSTGRES_PASSWORD: takeo_local_only
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takeo -d takeo_gemstones"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
